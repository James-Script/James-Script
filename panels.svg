<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Log de deploy, ferramentas e últimas entregas">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;fill:#d5e1ef}
.m{fill:#6f84a0}.c{fill:#39c5cf}.g{fill:#3fb950}.y{fill:#d4a72c}.b{fill:#58a6ff}
.in{animation:in .5s ease-out both}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.in,.blink,.pulse{animation:none}}
</style>
